nodePort:
image:
  #repository: data61/
  #tag: latest
  #full: terria-terrimap:1.0
  pullPolicy: Always
clientConfig:
  initializationUrls:
    - helm
    - terria
  parameters:
    bingMapsKey: AkaOmRFtjAb71cXgLwAGtLbj2RpkPKtVqAIroFQsocfurCBILxIeAWPkil7hhRy_
    disclaimer:
      text: "Disclaimer: This map must not be used for navigation or precise spatial analysis"
      url: "https://data.dev-wins.com"
    globalDisclaimer:
      confirmationRequired: true
      buttonTitle: "I agree"
      title: "Disclaimer"
      prodHostRegex: "data.\\.com$"
      devHostRegex: "\\b(staging|preview|test|dev)\\."
      enableOnLocalhost: true
    developerAttribution:
      text: "UNESCO"
      link: "http://data.dev-wins.com"
    appName: "Terria Map"
    brandBarElements:
      [
        "",
        '<a target="_blank" href="http://terria.io"><img src="images/terria_logo.png" height="52" title="Version: {{version}}" /></a>',
        ""
      ]
    supportEmail: "projas@cazalac.org"
    mobileDefaultViewerMode: "2d"
    experimentalFeatures: true
initConfig:
  homeCamera:
    north: "-8"
    east: "158"
    south: "-45"
    west: "109"
  catalog: []
serverConfig:
  port: 3001
  allowProxyFor: [
  "dev-wins.com",
  ]
  initPaths:
    - "/etc/config/client"
  trustProxy: true
  proxyAllDomains: true
  singlePageRouting:
      resolvePathRelativeToWwwroot: "/index.html"
      # Whether to route unmatched routes to /index.html and let the frontend resolve the route
      resolveUnmatchedPathsWithIndexHtml: true
    
  
resources:
  {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #  cpu: 100m
  #  memory: 128Mi
  # requests:
  #  cpu: 100m
  #  memory: 128Mi
